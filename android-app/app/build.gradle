plugins { id 'com.android.application' }

def releaseSigning = new java.util.Properties()
File releaseSigningFile = rootProject.file('release-signing.properties')
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}

android {
    namespace 'cn.folotoy.passportnotify'
    compileSdk 36

    defaultConfig {
        applicationId 'cn.folotoy.passportnotify'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '1.4.0'
    }

    signingConfigs {
        release {
            if (releaseSigningFile.exists()) {
                storeFile rootProject.file(releaseSigning['storeFile'])
                storePassword releaseSigning['storePassword']
                keyAlias releaseSigning['keyAlias']
                keyPassword releaseSigning['keyPassword']
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
